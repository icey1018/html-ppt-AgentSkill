<svg xmlns="http://www.w3.org/2000/svg" width="810" height="1080" viewBox="0 0 810 1080">
  <foreignObject x="0" y="0" width="810" height="1080">
    <html xmlns="http://www.w3.org/1999/xhtml" lang="zh-CN">
      <head>
        <meta charset="utf-8"/>
        <link rel="stylesheet" href="../../../assets/fonts.css"/>
<link rel="stylesheet" href="../../../assets/base.css"/>
<link rel="stylesheet" href="../../../assets/themes/xiaohongshu-white.css"/>
<link rel="stylesheet" href="../../../assets/animations/animations.css"/>
<link rel="stylesheet" href="../style.css"/>
        <style>
          html, body { margin:0; padding:0; width:810px; height:1080px; overflow:hidden; background:transparent; }
          body.tpl-xhs-post { min-height:1080px; background:transparent; display:block; }
          body.tpl-xhs-post .deck { width:810px; height:1080px; }
          body.tpl-xhs-post .slide { position:relative; inset:auto; width:810px; height:1080px; opacity:1; pointer-events:auto; }
        </style>
      </head>
      <body class="tpl-xhs-post">
        <div class="deck">
          <section class="slide is-active" data-title="Skill">
    <div class="page-dot">3 / 12</div>
    <div class="num-circle">2</div>
    <h2 class="h2 mt-m" data-anim="fade-up">Skill（技能包）</h2>
    <div class="stack mt-l anim-stagger-list">
      <div class="hand-box"><b style="font-size:22px">它是什么？</b><p class="dim" style="font-size:18px;margin-top:4px">给 Agent 的“固定工作 SOP”</p></div>
      <div class="hand-box"><b style="font-size:22px">包含什么？</b><p class="dim" style="font-size:18px;margin-top:4px">规则、模板、工具调用方式</p></div>
      <div class="hand-box"><b style="font-size:22px">为什么重要？</b><p class="dim" style="font-size:18px;margin-top:4px">让输出稳定，不靠临场发挥</p></div>
    </div>
    <div class="sticker blue" style="bottom:145px;left:50%;transform:translateX(-50%) rotate(-2deg)">像“菜谱 + 厨房流程卡”</div>
    <div class="notes">可补一句：没有 skill，Agent 每次都像新手上岗。</div>
  </section>
        </div>
      </body>
    </html>
  </foreignObject>
</svg>
